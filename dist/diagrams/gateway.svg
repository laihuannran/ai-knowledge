<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="title desc"><title id="title">推理网关：为什么企业不直接调用模型？</title><desc id="desc">应用发起请求；网关：鉴权与配额；适配厂商接口；模型服务返回结果。概念示意，细节见正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#718772" stroke-width="1.5"/></marker></defs><rect width="840" height="340" rx="16" fill="#edf1e8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="34" text-anchor="start" fill="#6f8072" font-size="11">FIELD NOTE / 66</text><rect x="28" y="94" width="174" height="145" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="46" y="119" text-anchor="start" fill="#6f8072" font-size="11">01</text><text x="46" y="150" text-anchor="start" fill="#234d3d" font-size="16">应用发起请求</text><path d="M208 166 H224" fill="none" stroke="#718772" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="232" y="94" width="174" height="145" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="250" y="119" text-anchor="start" fill="#6f8072" font-size="11">02</text><text x="250" y="150" text-anchor="start" fill="#234d3d" font-size="16">网关：鉴权与配额</text><path d="M412 166 H428" fill="none" stroke="#718772" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="436" y="94" width="174" height="145" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="454" y="119" text-anchor="start" fill="#6f8072" font-size="11">03</text><text x="454" y="150" text-anchor="start" fill="#234d3d" font-size="16">适配厂商接口</text><path d="M616 166 H632" fill="none" stroke="#718772" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="94" width="174" height="145" rx="12" fill="#245c48" stroke="#c8d5c6"/><text x="658" y="119" text-anchor="start" fill="#b5d1bf" font-size="11">04</text><text x="658" y="150" text-anchor="start" fill="#fff" font-size="16">模型服务返回结果</text><text x="28" y="295" text-anchor="start" fill="#6f8072" font-size="13">从左向右阅读 · 简化流程，实际实现可能不同</text></g></svg>