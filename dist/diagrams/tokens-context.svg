<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="title desc"><title id="title">Token、上下文和幻觉：为什么它会忘，也会编？</title><desc id="desc">文字或其他输入；Tokenizer：切分编码；上下文：当前材料；生成：下一个 Token</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64746c" stroke-width="1.5"/></marker></defs><rect width="840" height="340" rx="16" fill="#f0f3ed"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" fill="#52675c" font-size="12" letter-spacing="2">FIELD NOTE / 03</text><rect x="28" y="95" width="174" height="142" rx="10" fill="#fff" stroke="#cbd9cf"/><text x="43" y="124" fill="#81978b" font-size="12">01</text><text x="43" y="157" fill="#173d31" font-size="16">文字或其他输入</text><path d="M207 166h20" stroke="#64746c" fill="none" marker-end="url(#arrow)"/><rect x="232" y="95" width="174" height="142" rx="10" fill="#fff" stroke="#cbd9cf"/><text x="247" y="124" fill="#81978b" font-size="12">02</text><text x="247" y="157" fill="#173d31" font-size="16">Tokenizer：</text><text x="247" y="181" fill="#173d31" font-size="16">切分编码</text><path d="M411 166h20" stroke="#64746c" fill="none" marker-end="url(#arrow)"/><rect x="436" y="95" width="174" height="142" rx="10" fill="#fff" stroke="#cbd9cf"/><text x="451" y="124" fill="#81978b" font-size="12">03</text><text x="451" y="157" fill="#173d31" font-size="16">上下文：当前材料</text><path d="M615 166h20" stroke="#64746c" fill="none" marker-end="url(#arrow)"/><rect x="640" y="95" width="174" height="142" rx="10" fill="#1f5b49" stroke="#cbd9cf"/><text x="655" y="124" fill="#bdd9cc" font-size="12">04</text><text x="655" y="157" fill="#fff" font-size="16">生成：下一个 Tok</text><text x="655" y="181" fill="#fff" font-size="16">en</text><text x="28" y="294" fill="#687a6e" font-size="13">从左向右阅读 · 简化流程，实际实现可能不同</text></g></svg>