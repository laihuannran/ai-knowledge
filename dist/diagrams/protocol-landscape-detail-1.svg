<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="title desc"><title id="title">放大一跳的职责</title><desc id="desc">HTTP 承载远程请求；JSON-RPC 表达调用；MCP 解释工具含义；业务系统校验并查询。概念示意，细节见正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#718772" stroke-width="1.5"/></marker></defs><rect width="840" height="340" rx="16" fill="#edf1e8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="34" text-anchor="start" fill="#6f8072" font-size="11">FIELD NOTE / 80</text><rect x="28" y="94" width="174" height="145" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="46" y="119" text-anchor="start" fill="#6f8072" font-size="11">01</text><text x="46" y="150" text-anchor="start" fill="#234d3d" font-size="16">HTTP 承载远</text><text x="46" y="173" text-anchor="start" fill="#234d3d" font-size="16">程请求</text><path d="M208 166 H224" fill="none" stroke="#718772" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="232" y="94" width="174" height="145" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="250" y="119" text-anchor="start" fill="#6f8072" font-size="11">02</text><text x="250" y="150" text-anchor="start" fill="#234d3d" font-size="16">JSON-RPC</text><text x="250" y="173" text-anchor="start" fill="#234d3d" font-size="16"> 表达调用</text><path d="M412 166 H428" fill="none" stroke="#718772" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="436" y="94" width="174" height="145" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="454" y="119" text-anchor="start" fill="#6f8072" font-size="11">03</text><text x="454" y="150" text-anchor="start" fill="#234d3d" font-size="16">MCP 解释工具</text><text x="454" y="173" text-anchor="start" fill="#234d3d" font-size="16">含义</text><path d="M616 166 H632" fill="none" stroke="#718772" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="94" width="174" height="145" rx="12" fill="#245c48" stroke="#c