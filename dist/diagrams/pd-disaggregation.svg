<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="title desc"><title id="title">PD 分离：把读题和写答案交给不同实例</title><desc id="desc">P 实例：处理输入；传输 KV 状态；D 实例：生成输出；分别扩容与调度。概念示意，细节见正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#718772" stroke-width="1.5"/></marker></defs><rect width="840" height="340" rx="16" fill="#edf1e8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="34" text-anchor="start" fill="#6f8072" font-size="11">FIELD NOTE / 66</text><rect x="28" y="100" width="200" height="125" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="46" y="125" text-anchor="start" fill="#6f8072" font-size="11">01</text><text x="46" y="156" text-anchor="start" fill="#234d3d" font-size="16">P 实例：处理输入</text><rect x="321" y="100" width="200" height="125" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="339" y="125" text-anchor="start" fill="#6f8072" font-size="11">02</text><text x="339" y="156" text-anchor="start" fill="#234d3d" font-size="16">KV 状态传输</text><rect x="614" y="100" width="200" height="125" rx="12" fill="#245c48" stroke="#c8d5c6"/><text x="632" y="125" text-anchor="start" fill="#b5d1bf" font-size="11">03</text><text x="632" y="156" text-anchor="start" fill="#fff" font-size="16">D 实例：生成输出</text><path d="M234 160 H309" fill="none" stroke="#718772" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M527 160 H602" fill="none" stroke="#718772" stroke-width="1.8" marker-end="url(#arrow)"/><text x="28" y="273" text-anchor="start" fill="#6f8072" font-size="14">P / D 可分别调度与扩容；两侧仍需相容的模型状态。</text><text x="28" y="304" text-anchor="start" fill="#6f8072" font-size="14">收益受排队、网络与 KV 传输影响，并非保证加速。</text></g></svg>