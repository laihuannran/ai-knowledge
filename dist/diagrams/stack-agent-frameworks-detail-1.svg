<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc"><title id="title">工具调用与责任转交</title><desc id="desc">作为工具：主Agent负责；作为工具：结果返回主Agent；发生交接：新Agent接管；发生交接：明确上下文范围。概念示意，细节见正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#718772" stroke-width="1.5"/></marker></defs><rect width="840" height="420" rx="16" fill="#edf1e8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="34" text-anchor="start" fill="#6f8072" font-size="11">FIELD NOTE / 62</text><rect x="28" y="60" width="382" height="126" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="46" y="85" text-anchor="start" fill="#6f8072" font-size="11">01</text><text x="46" y="116" text-anchor="start" fill="#234d3d" font-size="16">作为工具：主Agent负责</text><rect x="430" y="60" width="382" height="126" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="448" y="85" text-anchor="start" fill="#6f8072" font-size="11">02</text><text x="448" y="116" text-anchor="start" fill="#234d3d" font-size="16">作为工具：结果返回主Agent</text><rect x="28" y="207" width="382" height="126" rx="12" fill="#fffefa" stroke="#c8d5c6"/><text x="46" y="232" text-anchor="start" fill="#6f8072" font-size="11">03</text><text x="46" y="263" text-anchor="start" fill="#234d3d" font-size="16">发生交接：新Agent接管</text><rect x="430" y="207" width="382" height="126" rx="12" fill="#245c48" stroke="#c8d5c6"/><text x="448" y="232" text-anchor="start" fill="#b5d1bf" font-size="11">04</text><text x="448" y="263" text-anchor="start" fill="#fff" font-size="16">发生交接：明确上下文范围</text><text x="28" y="389" text-anchor="start" fill="#6f8072" font-size="13">并列概念或比较维度 · 不表示执行顺序</text></g></svg>